<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFT Operations Hub — Concrete Floor Tek</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cft: {
              navy:    '#1B2A4A',
              orange:  '#E8712B',
              success: '#2ECC71',
              warning: '#F39C12',
              danger:  '#E74C3C',
              bg:      '#0F1923',
              surface: '#1A2736',
              line:    '#243447',
              text:    '#E8ECF1',
              muted:   '#7B8FA3',
            },
          },
          fontFamily: {
            display: ['"Barlow Condensed"', 'sans-serif'],
            body:    ['"IBM Plex Sans"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    html, body, #root { height: 100%; }
    body {
      background: #0F1923;
      color: #E8ECF1;
      font-family: 'IBM Plex Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-display { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.02em; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #243447; border-radius: 999px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pulse-dot { animation: pulseDot 1.8s ease-in-out infinite; }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .drag-over {
      background: rgba(232,113,43,0.10) !important;
      box-shadow: inset 0 0 0 2px #E8712B;
    }
    .dragging { opacity: 0.45; }
  </style>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="./CFTOperationsHub.jsx" data-presets="react"></script>
</body>
</html>
